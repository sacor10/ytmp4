name: Release

# Runs for two triggers:
#   - pushing a `vX.Y` tag directly (manual release at a chosen version)
#   - any push to main (auto release — bumps the minor version and tags it)
on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              value="1.0"
            else
              ver="${latest#v}"
              major="${ver%%.*}"
              minor="${ver#*.}"
              value="${major}.$((minor + 1))"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v$value"
            git push origin "v$value"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Download yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path YtMp4/tools | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "YtMp4/tools/yt-dlp.exe"

      - name: Download FFmpeg (shared build with DLLs)
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip" `
            -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)/ffmpeg.exe" "YtMp4/tools/ffmpeg.exe"
          Copy-Item "$($bin.FullName)/*.dll"      "YtMp4/tools/"

      - name: Download Deno (JS runtime yt-dlp needs for YouTube signature extraction)
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" `
            -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath YtMp4/tools -Force

      - name: Publish (self-contained, single-file, win-x64)
        shell: pwsh
        run: |
          dotnet publish YtMp4/YtMp4.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/app

      - name: Assemble package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.value }}"
          Copy-Item -Path "YtMp4/tools" -Destination "dist/app/tools" -Recurse
          @"
          YtMp4 v$ver - YouTube to MP4 Downloader
          ==========================================
          1. Extract this zip to any folder
          2. Run YtMp4.exe
          3. Paste a YouTube URL, pick a save folder, click Download

          No installation needed. Windows 10/11 x64 only.
          "@ | Out-File -FilePath "dist/app/README.txt" -Encoding utf8
          Compress-Archive -Path "dist/app/*" -DestinationPath "dist/ytmp4.zip"
          $mb = [math]::Round((Get-Item "dist/ytmp4.zip").Length / 1MB, 0)
          Write-Host "Package: ytmp4.zip ($mb MB)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          files: dist/ytmp4.zip
          generate_release_notes: true
