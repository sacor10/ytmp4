name: Release

# Runs for three triggers:
#   - manual trigger via workflow_dispatch (optionally specify version or auto-bump)
#   - pushing a `vX.Y` tag directly (manual release at a chosen version)
#   - any push to main (auto release — bumps the minor version and tags it)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.6). Leave blank to auto-increment from latest tag.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            raw="${{ github.event.inputs.version }}"
            value="${raw#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              value="1.0"
            else
              ver="${latest#v}"
              major="${ver%%.*}"
              minor="${ver#*.}"
              value="${major}.$((minor + 1))"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "v$value" >/dev/null 2>&1; then
              git tag "v$value"
              git push origin "v$value"
            fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Download yt-dlp
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/download-asset.ps1 `
            -Repo "yt-dlp/yt-dlp" `
            -Pattern "yt-dlp.exe" `
            -OutDir "YtMp4/tools" `
            -FallbackUrl "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

      - name: Download FFmpeg (shared build with DLLs)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/download-asset.ps1 `
            -Repo "BtbN/FFmpeg-Builds" `
            -Tag "latest" `
            -Pattern "ffmpeg-master-latest-win64-lgpl-shared.zip" `
            -OutDir "." `
            -FallbackUrl "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Expand-Archive ffmpeg-master-latest-win64-lgpl-shared.zip -DestinationPath ffmpeg-tmp -Force
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)/ffmpeg.exe" "YtMp4/tools/ffmpeg.exe" -Force
          Copy-Item "$($bin.FullName)/*.dll"      "YtMp4/tools/" -Force
          Remove-Item -Recurse -Force ffmpeg-tmp
          Remove-Item -Force ffmpeg-master-latest-win64-lgpl-shared.zip

      - name: Download Deno (JS runtime yt-dlp needs for YouTube signature extraction)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/download-asset.ps1 `
            -Repo "denoland/deno" `
            -Pattern "deno-x86_64-pc-windows-msvc.zip" `
            -OutDir "." `
            -FallbackUrl "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          Expand-Archive deno-x86_64-pc-windows-msvc.zip -DestinationPath YtMp4/tools -Force
          Remove-Item -Force deno-x86_64-pc-windows-msvc.zip

      - name: Verify tools
        shell: pwsh
        run: |
          $required = @("yt-dlp.exe", "ffmpeg.exe", "deno.exe")
          foreach ($file in $required) {
            $path = Join-Path "YtMp4/tools" $file
            if (-not (Test-Path $path)) {
              throw "Missing required tool: $path"
            }
            $size = (Get-Item $path).Length
            if ($size -le 0) {
              throw "Tool file $path is empty (0 bytes)"
            }
            Write-Host "Verified $path ($([math]::Round($size / 1MB, 2)) MB)"
          }

      - name: Publish (self-contained, single-file, win-x64)
        shell: pwsh
        run: |
          dotnet publish YtMp4/YtMp4.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/app

      - name: Assemble package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.value }}"
          Copy-Item -Path "YtMp4/tools" -Destination "dist/app/tools" -Recurse
          @"
          YtMp4 v$ver - YouTube to MP4 Downloader
          ==========================================
          1. Extract this zip to any folder
          2. Run YtMp4.exe
          3. Paste a YouTube URL, pick a save folder, click Download

          No installation needed. Windows 10/11 x64 only.
          "@ | Out-File -FilePath "dist/app/README.txt" -Encoding utf8
          Compress-Archive -Path "dist/app/*" -DestinationPath "dist/ytmp4.zip"
          $mb = [math]::Round((Get-Item "dist/ytmp4.zip").Length / 1MB, 0)
          Write-Host "Package: ytmp4.zip ($mb MB)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          files: dist/ytmp4.zip
          generate_release_notes: true
